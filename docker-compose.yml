version: "3.8"

services:
  receiver:
    build:
      context: ./receiver-service
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/pubsub
      - REDIS_URI=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - pubsub-network
    restart: unless-stopped
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        max_attempts: 3

  listener:
    build:
      context: ./listener-service
    env_file:
      - ./.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/pubsub
      - REDIS_URI=redis://redis:6379
    depends_on:
      - mongodb
      - redis
      - receiver
    networks:
      - pubsub-network
    restart: unless-stopped
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        max_attempts: 3

  mongodb:
    image: mongo:6.0
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - pubsub-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pubsub-network
    restart: unless-stopped

networks:
  pubsub-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
